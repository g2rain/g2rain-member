name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish versioned image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v5.0.0 (Node 24), pinned to its immutable release commit.
      - name: Check out the tagged source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-java v5.5.0 (Node 24), pinned to its immutable release commit.
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate release tag and source state
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH tag pushes may publish; got '${tag}'." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Tag '${tag}' points to ${tag_commit}, which is not in origin/main history." >&2
            exit 1
          fi

          version="${tag#v}"
          release_note="docs/releases/v${version}.md"
          if ! git cat-file -e "${tag_commit}:${release_note}" 2>/dev/null; then
            echo "Missing ${release_note} at the tagged commit." >&2
            exit 1
          fi
          if [[ -z "$(git show "${tag_commit}:${release_note}" | tr -d '[:space:]')" ]]; then
            echo "${release_note} is empty at the tagged commit." >&2
            exit 1
          fi

          project_version="$(mvn --batch-mode --no-transfer-progress -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          if [[ "${project_version}" != "${version}" ]]; then
            echo "Tag '${tag}' does not match Maven project version '${project_version}'." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${tag_commit}" >> "${GITHUB_OUTPUT}"

      - name: Build and test all Maven modules
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Log in to GHCR with GITHUB_TOKEN
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push both immutable image tags
        env:
          EXTRA_TAGS: sha-${{ steps.release.outputs.commit }}
        shell: bash
        run: ./build.sh "${{ steps.release.outputs.version }}" push

      - name: Report completed publication
        if: success()
        shell: bash
        run: |
          {
            echo '## GHCR publication complete'
            echo
            echo '- Image: `ghcr.io/g2rain/g2rain-member`'
            echo '- Tags: `${{ steps.release.outputs.version }}`, `sha-${{ steps.release.outputs.commit }}`'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io
