name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish versioned image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-java v6.0.1
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate release tag and source state
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH tag pushes may publish; got '${tag}'." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Tag '${tag}' points to ${tag_commit}, which is not in origin/main history." >&2
            exit 1
          fi

          version="${tag#v}"
          release_note="docs/releases/v${version}.md"
          if ! git cat-file -e "${tag_commit}:${release_note}" 2>/dev/null; then
            echo "Missing ${release_note} at the tagged commit." >&2
            exit 1
          fi
          if [[ -z "$(git show "${tag_commit}:${release_note}" | tr -d '[:space:]')" ]]; then
            echo "${release_note} is empty at the tagged commit." >&2
            exit 1
          fi

          project_version="$(mvn --batch-mode --no-transfer-progress -q -Dstyle.color=never -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "${project_version}" != "${version}" ]]; then
            echo "Tag '${tag}' does not match Maven project version '${project_version}'." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${tag_commit}" >> "${GITHUB_OUTPUT}"

      - name: Build and test all Maven modules
        run: mvn --batch-mode --no-transfer-progress -U clean install

      - name: Log in to GHCR with GITHUB_TOKEN
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push both immutable image tags
        env:
          EXTRA_TAGS: sha-${{ steps.release.outputs.commit }}
        shell: bash
        working-directory: g2rain-member-startup
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -DskipTests=true compile jib:build \
            "-Djib.to.image=ghcr.io/g2rain/g2rain-member:${{ steps.release.outputs.version }}" \
            "-Djib.to.tags=${EXTRA_TAGS}"

      - name: Report completed publication
        if: success()
        shell: bash
        run: |
          {
            echo '## GHCR publication complete'
            echo
            echo '- `ghcr.io/g2rain/g2rain-member:${{ steps.release.outputs.version }}`'
            echo '- `ghcr.io/g2rain/g2rain-member:sha-${{ steps.release.outputs.commit }}`'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io

  publish-maven:
    name: Publish API after image
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-maven.yml
